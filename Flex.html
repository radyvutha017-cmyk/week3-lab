<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Flexbox Layout Exercise</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    height: 100%;
  }

  .page {
    display: flex;
    flex-direction: column;
    gap: 10px;
    height: 100vh;
    padding: 10px;
    background-color: rgb(69, 130, 81);
  }

  header {
    height: 100px;
    background-color: rgb(17, 179, 138);
    color: white;
  }

  main {
    flex-grow: 1;
    background-color: rgb(47, 189, 170);
    color: white;
  }

  footer {
    height: 100px;
    background-color: rgb(90, 205, 207);
    color: white;
  }
</style>
</head>
<body>

<div class="page">
  <header>Header</header>
  <main>Main Content</main>
  <footer>Footer</footer>
</div>

</body>
</html>
